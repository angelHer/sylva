<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>sylva</title>
  <!-- The mark is the program's subject: one root at the bottom, three
       worktrees rising out of it, drawn in the lane colours the graph uses. -->
  <rect width="128" height="128" rx="28" fill="#07090D"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" fill="none" stroke="#1E2635"/>

  <g fill="none" stroke-width="5" stroke-linecap="round">
    <!-- left branch -->
    <path d="M64 100 C64 76 40 74 40 50" stroke="#FF2E97"/>
    <!-- centre trunk -->
    <path d="M64 100 L64 42" stroke="#00E5FF"/>
    <!-- right branch -->
    <path d="M64 100 C64 76 88 74 88 50" stroke="#39FF14"/>
  </g>

  <!-- the tips -->
  <circle cx="40" cy="46" r="9" fill="#07090D" stroke="#FF2E97" stroke-width="5"/>
  <circle cx="64" cy="38" r="9" fill="#07090D" stroke="#00E5FF" stroke-width="5"/>
  <circle cx="88" cy="46" r="9" fill="#07090D" stroke="#39FF14" stroke-width="5"/>

  <!-- the shared root -->
  <circle cx="64" cy="100" r="11" fill="#00E5FF"/>
</svg>
