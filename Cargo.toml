[package]
name = "sylva"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A fast, native Git client built around worktrees: many trees, one root"
license = "MIT"

[dependencies]
eframe = "0.29.1"
# Already pulled in by eframe, declared here so `--screenshot` can encode the
# captured framebuffer. Costs nothing extra to build.
image = { version = "0.25", default-features = false, features = ["png"] }
# default-features = false drops the ssh/https transports (and with them the
# openssl/libssh2 build chain). v1 is read-only over local repositories, so the
# network transports are dead weight. Re-enable when push/fetch lands.
git2 = { version = "0.19", default-features = false }
thiserror = "1"
notify = "8.2.0"
# The "open a repository" dialog on the welcome screen. Default features use the
# XDG desktop portal, which is pure Rust over D-Bus — no GTK, so the build stays
# free of C dependencies beyond libgit2.
rfd = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Dependencies are optimized even in dev builds: libgit2 walking a large
# history is unusably slow at opt-level 0, and it is recompiled rarely.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
